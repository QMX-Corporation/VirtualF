name: VirtualF Merge Ability Auditor

on:
  workflow_dispatch:

jobs:
  merge-ability-audit:
    name: Merge Integrity Check (${{ matrix.processor }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        processor: [Threadripper, Core-i9, Core-i7, Core-i5, Core-i3]

    steps:
      # Step 1: Checkout the target repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install core development tools, QEMU, and Valgrind
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            qemu-system-x86 \
            valgrind \
            make \
            mtools \
            xorriso

      # Step 3: Assemble all low-level assembly packages into the core binary
      - name: Compile Assembly Modules
        run: |
          nasm -f bin SrcPkg/**/*.asm \
                DebuggerPkg/**/*.asm \
                DecodePkg/**/*.asm \
                ArchPkg/**/*.asm \
                SecurityPkg/**/*.asm \
                CryptoPkg/**/*.asm \
                DescryptoPkg/**/*.asm \
                MdeModulePkg/**/*.asm \
                ModulePkg/**/*.asm \
                -o build/virtual-f.bin

      # Step 4: Execute merge readiness verification checks under QEMU
      - name: Execute Merge Emulation Verification
        run: |
          mkdir -p build/logs
          for merge_test_id in $(seq 1 100); do
            qemu-system-x86_64 -no-cpuid-checks -nographic -display none -smp 4 \
              -kernel ./build/virtual-f.bin \
              -D build/logs/merge_ability_test_${merge_test_id}.log || exit 1
          done

      # Step 5: Perform strict memory validation and leak detection prior to merge
      - name: Run Memory Checks with Valgrind
        run: |
          valgrind --leak-check=full --error-exitcode=1 ./build/virtual-f.bin
